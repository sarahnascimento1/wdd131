<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <meta name="description" content="Fundamentos da Web Dinâmica realizada pela aluna Sarah Nascimento - Semana 05">
    <meta name="author" content="Sarah Nascimento">
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    
</head>
<body>

    <main>
        <header><h1>Avaliação do Produto</h1></header>
        <form method="get" action="avaliacao.html" class="formulario">
            <fieldset>
                <legend>Feedback sobre o Produto</legend>
                <label for="name" class="rotulo">
                    Seu Nome <span class="opcional">(opcional)</span>
                </label>
                <input type="text" name="nome" id="name">

                <label for="opniao" class="rotulo">Queremos saber sua opnião <span class="opcional">(opcional)</span></label>
                <textarea name="opniao" id="opniao" rows="5" cols="40"></textarea>
            </fieldset>

            <fieldset>
                <legend>Avaliação</legend>
               
                    <label for="produto" class="rotulo">Selecione o Produto:</label>
                    <select name="produto" id="produto" required>
                        <option value="" disabled selected>Selecione um produto</option>
                    </select>


                    <div class="frase-star">Quantas estrelas esse produto merece?</div>
                    <div class="estrelas">
                        <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                        <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                        <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                        <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                        <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                    </div>

                    <label for="data" class="rotulo">Data de Instalação</label>
                    <input type="date" name="data" id="data" required>

                    <div class="opcoes">Quais recursos você achou úteis no produto? (Marque as opções que deseja)</div>
                    <label for="duracao"><input type="checkbox" name="duracao" id="duracao" value="sim">Durabilidade</label>
                    <label for="facilidade"><input type="checkbox" name="facilidade" id="facilidade" value="sim">Facilidade de Uso</label>
                    <label for="desempenho"><input type="checkbox" name="desempenho" id="desempenho" value="sim">Desempenho</label>
                    <label for="design"><input type="checkbox" name="design" id="design" value="sim">Design</label>
            </fieldset>
            <input type="submit" value="Enviar Avaliação">

        </form>
    </main>

    <footer>
        <p> ©<span id="anoatual"></span>🍃Sarah Nascimento🍃São Paulo</p>
        <p id="ultimaModificacao"></p>
    </footer>
</body>
</html>
